services:
  postgres:
    image: postgres:16-alpine
    container_name: kairos-nest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos_db
    ports:
      # Host 5434 -> container 5432. 5432 is the local Postgres and 5433 is
      # another project's container, so this project uses 5434 to avoid clashes.
      - '5434:5432'
    volumes:
      - kairos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kairos -d kairos_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kairos_pgdata:
